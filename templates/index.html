<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Render Server</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --border-color: #cccccc;
        }

        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --primary-hover: #9965f4;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            transition: background-color 0.3s;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group div {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button.submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        body.dark-mode button.submit-btn {
            color: #121212;
        }

        button.submit-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .preview-section {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: none;
            /* Hidden by default */
        }

        .preview-media {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #218838;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: var(--text-color);
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 20px;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.5s;
        }

        .status-text {
            text-align: center;
            margin-top: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">🌓</button>

    <div class="container">
        <h1>Blender Render Server</h1>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Upload .blend file:</label>
                <input type="file" name="file" id="file" accept=".blend" required>
            </div>

            <div class="form-group">
                <label>Render Type:</label>
                <div class="radio-group">
                    <div>
                        <input type="radio" id="image" name="render_type" value="image" checked>
                        <label for="image">Image (Frame 1)</label>
                    </div>
                    <div>
                        <input type="radio" id="animation" name="render_type" value="animation">
                        <label for="animation">Animation</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Upload and Render</button>
        </form>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText">Uploading...</div>
        </div>

        <div class="preview-section" id="previewSection">
            <h2>Render Preview</h2>
            <div id="mediaContainer"></div>
            <br>
            <a href="#" class="download-btn" id="downloadLink">Download Result</a>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const body = document.body;
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const previewSection = document.getElementById('previewSection');
        const mediaContainer = document.getElementById('mediaContainer');
        const downloadLink = document.getElementById('downloadLink');

        // Theme Logic
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
        }

        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });

        // Upload Logic
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            submitBtn.disabled = true;
            progressContainer.style.display = 'block';
            previewSection.style.display = 'none';
            progressFill.style.width = '0%';
            statusText.textContent = 'Uploading...';

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Upload failed');
                }

                const data = await response.json();
                const jobId = data.job_id;

                statusText.textContent = 'Rendering...';
                pollStatus(jobId);

            } catch (error) {
                statusText.textContent = 'Error: ' + error.message;
                submitBtn.disabled = false;
            }
        });

        async function pollStatus(jobId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/status/${jobId}`);
                    const data = await response.json();

                    if (data.status === 'rendering') {
                        progressFill.style.width = `${data.progress}%`;
                        statusText.textContent = `Rendering... ${data.progress}%`;
                    } else if (data.status === 'complete') {
                        clearInterval(interval);
                        progressFill.style.width = '100%';
                        statusText.textContent = 'Complete!';
                        showResult(data.result_file);
                        submitBtn.disabled = false;
                    } else if (data.status === 'error') {
                        clearInterval(interval);
                        statusText.textContent = 'Error: ' + data.error;
                        submitBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 1000);
        }

        function showResult(filename) {
            previewSection.style.display = 'block';
            downloadLink.href = `/download/${filename}`;

            mediaContainer.innerHTML = '';
            if (filename.endsWith('.mp4') || filename.endsWith('.mkv') || filename.endsWith('.avi')) {
                const video = document.createElement('video');
                video.controls = true;
                video.className = 'preview-media';
                const source = document.createElement('source');
                source.src = `/download/${filename}`;
                source.type = 'video/mp4';
                video.appendChild(source);
                mediaContainer.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = `/download/${filename}`;
                img.alt = 'Rendered Preview';
                img.className = 'preview-media';
                mediaContainer.appendChild(img);
            }
        }
    </script>
</body>

</html>
